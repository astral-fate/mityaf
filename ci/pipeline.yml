name: pipeline

# The satellite pipeline is batch by nature (Sentinel revisit is ~5 days), so it
# runs here rather than on Vercel — which has no writable filesystem, short
# function timeouts, and no scheduler. The resulting commit triggers a deploy.
on:
  schedule:
    - cron: '0 3 * * *'   # daily 03:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          npm run pipeline -- doctor
          npm run pipeline -- backfill-weather
          npm run pipeline -- backfill-s2
          npm run pipeline -- export-static
      - name: Commit refreshed data
        run: |
          git config user.name  "mityaf-bot"
          git config user.email "bot@users.noreply.github.com"
          git add apps/web/public/data
          git diff --staged --quiet || git commit -m "chore(data): refresh precomputed layers"
          git push
